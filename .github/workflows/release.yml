# On a version tag (v0.3.0): zip the Bedroll folder and attach it to a GitHub release, so players and updaters can
# download it. The tag must match "## Version:" in Bedroll/Bedroll.toc.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          toc=$(grep -m1 '^## Version:' Bedroll/Bedroll.toc | awk '{print $3}')
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Bedroll.toc version $toc"; exit 1
          fi
      - name: Zip the addon
        run: zip -r "Bedroll-${GITHUB_REF_NAME#v}.zip" Bedroll
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Bedroll-${GITHUB_REF_NAME#v}.zip" --title "Bedroll ${GITHUB_REF_NAME#v}" --generate-notes
